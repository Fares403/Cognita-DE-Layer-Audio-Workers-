version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    volumes:
      - ./infrastructure/minio/data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  ingest_worker:
    build: ./workers/ingest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ENDPOINT=minio
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_BUCKET=raw-audio-meetings

  preprocessing_worker:
    build: ./workers/preprocessing
    depends_on:
      ingest_worker:
        condition: service_completed_successfully
    environment:
      - MINIO_ENDPOINT=minio
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_BUCKET=raw-audio-meetings

  validation_worker:
    build: ./workers/validation
    depends_on:
      preprocessing_worker:
        condition: service_completed_successfully
    environment:
      - MINIO_ENDPOINT=minio
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_BUCKET=raw-audio-meetings

  audio_extractor_worker:
    build: ./workers/audio_extractor
    depends_on:
      validation_worker:
        condition: service_completed_successfully
    environment:
      - MINIO_ENDPOINT=minio
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_BUCKET=raw-audio-meetings

  audio_normalizer_worker:
    build: ./workers/audio_normalizer
    depends_on:
      audio_extractor_worker:
        condition: service_completed_successfully
    environment:
      - MINIO_ENDPOINT=minio
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_BUCKET=raw-audio-meetings

  audio_chunker_worker:
    build: ./workers/audio_chunker
    depends_on:
      audio_normalizer_worker:
        condition: service_completed_successfully
    environment:
      - MINIO_ENDPOINT=minio
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_BUCKET=raw-audio-meetings
